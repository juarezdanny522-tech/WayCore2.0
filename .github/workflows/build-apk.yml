# Genera el APK de WayCore en cada push a main (o manualmente desde la
# pestaña Actions -> "Build APK" -> Run workflow).
#
# El APK queda en dos lugares:
#   1. En un Release de GitHub (etiqueta apk-<commit>) con el botón de descarga.
#   2. Como artifact de la corrida (90 días).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android/setup-android@v3
        with:
          platforms: android-36
          build-tools: "35.0.0"
          cmdline-tools: "12.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: wayfix
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: waycore-apk
          path: wayfix/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release con el APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            --title "WayCore $TAG (v0.7.0 - modelo local)" \
            --notes "APK de prueba de WayCore con Karbys y Qwen2.5-1.5B 100% local (se descarga el modelo desde la app, no se necesita PC).

Commit: ${GITHUB_SHA}

Instalación: habilita 'Orígenes desconocidos' en Ajustes si el teléfono lo pide, e instala el APK." \
            wayfix/app/build/outputs/apk/debug/app-debug.apk
